<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifier</title>
    <link href="../style.css" rel="stylesheet" />
    <link href="icon.png" rel="icon" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <header>
        <div class="pageTitle">
            <h1>COIL Team 8</h1>
            <h2>Classifier</h2>
        </div>
        <nav class="button">
            <a href="../index.html">Home</a>
            <a href="./about.html">About Us</a>
        </nav>
    </header>
    <div class="section main">
        <div class="card inputForm">
            <h2>Music Input</h2>
            <p>
                Fill out one or more of the following fields, and we will determine the mood profile from it!
            </p>
            <hr />
            <form id="moodForm">
                <label for="songTitle">Song Title:</label>
                <input type="text" id="songTitle"><br><br>

                <label for="artist">Artist:</label>
                <input type="text" id="artist"><br><br>

                <label for="lyrics">Lyrics:</label>
                <textarea id="lyrics" rows="6"></textarea><br><br>

                <label for="userMood">Your Mood:</label>
                <select id="userMood" name="userMood">
                    <option value="" disabled selected>-- Pick an emotion --</option>
                    <option value="joy">Joy</option>
                    <option value="excitement">Excitement</option>
                    <option value="amusement">Amusement</option>
                    <option value="love">Love</option>
                    <option value="caring">Caring</option>
                    <option value="admiration">Admiration</option>
                    <option value="gratitude">Gratitude</option>
                    <option value="optimism">Optimism</option>
                    <option value="pride">Pride</option>
                    <option value="relief">Relief</option>
                    <option value="approval">Approval</option>
                    <option value="desire">Desire</option>
                    <option value="surprise">Surprise</option>
                    <option value="curiosity">Curiosity</option>
                    <option value="realization">Realization</option>
                    <option value="neutral">Neutral</option>
                    <option value="confusion">Confusion</option>
                    <option value="nervousness">Nervousness</option>
                    <option value="embarrassment">Embarrassment</option>
                    <option value="disappointment">Disappointment</option>
                    <option value="annoyance">Annoyance</option>
                    <option value="sadness">Sadness</option>
                    <option value="remorse">Remorse</option>
                    <option value="anger">Anger</option>
                    <option value="disapproval">Disapproval</option>
                    <option value="fear">Fear</option>
                    <option value="grief">Grief</option>
                    <option value="disgust">Disgust</option>
                </select><br><br>

                <input class="button" type="submit" value="Classify Mood">
            </form>
        </div>
        <div class="card response">
            <h2>Response Section</h2>
            <hr />

            <div id="loading" style="display: none; text-align: center; padding: 20px;">
                <div class="spinner"></div>
                <p style="color: var(--accentgreen); margin-top: 10px;">Analyzing musical emotions...</p>
            </div>
            <p class="responseContent"></p>
            <button id="copyBtn" class="button" style="display: none; margin: 10px auto;">Copy Results</button>
            <script>
                function getMoodColor(mood) {
                    const colors = {
                        joy: '#FFD700', excitement: '#FF8C00', amusement: '#FFA500', love: '#FF69B4',
                        caring: '#FF9AA2', admiration: '#DDA0DD', gratitude: '#98FB98', optimism: '#FFEB3B',
                        pride: '#FFD700', relief: '#87CEEB', sadness: '#4A90D9', grief: '#4169E1',
                        remorse: '#6A5ACD', disappointment: '#708090', anger: '#FF4444', annoyance: '#FF6347',
                        disgust: '#8B4513', disapproval: '#CD5C5C', fear: '#9B59B6', nervousness: '#BA68C8',
                        embarrassment: '#E8A0BF', surprise: '#00CED1', curiosity: '#20B2AA', confusion: '#B0C4DE',
                        realization: '#48D1CC', desire: '#FF1493', approval: '#32CD32', neutral: '#888888',
                    };
                    return colors[mood] || '#05DF72';
                }

                // Maps moods to a 1-10 valence scale (10=very positive, 1=very negative)
                function getMoodValence(mood) {
                    const valence = {
                        joy: 9, excitement: 8, amusement: 8, love: 9, caring: 7, admiration: 7,
                        gratitude: 8, optimism: 8, pride: 8, relief: 6, approval: 7, desire: 6,
                        surprise: 6, curiosity: 7, realization: 5, neutral: 5, confusion: 4,
                        nervousness: 3, embarrassment: 3, disappointment: 3, annoyance: 3,
                        sadness: 2, remorse: 2, anger: 2, disapproval: 2, fear: 2, grief: 1, disgust: 1,
                    };
                    return valence[mood] ?? 5;
                }

                function getMoodCombinationPhrase(moods) {
                    if (!moods || moods.length < 2) return "A focused emotional state.";
                    const m1 = moods[0].mood;
                    const m2 = moods[1].mood;
                    const combinations = {
                        "sadness+fear": "haunting melancholy",
                        "fear+sadness": "haunting melancholy",
                        "joy+excitement": "euphoric energy",
                        "excitement+joy": "euphoric energy",
                        "anger+disgust": "bitter resentment",
                        "optimism+joy": "radiant hope",
                        "neutral+confusion": "pensive uncertainty"
                    };
                    const key = `${m1}+${m2}`;
                    return combinations[key] || `${m1} blended with ${m2}`;
                }

                document.getElementById('moodForm').addEventListener('submit', async function (event) {

                    event.preventDefault(); // stop page refresh

                    const title = document.getElementById("songTitle").value.trim();
                    const artist = document.getElementById("artist").value.trim();
                    const lyrics = document.getElementById("lyrics").value.trim();
                    const responseBox = document.querySelector(".responseContent");

                    const loader = document.getElementById("loading");
                    loader.style.display = "block";
                    responseBox.innerHTML = "";

                    try {
                        const res = await fetch("https://coil-team-8-microservice-bsfbd7b2bndbcvfg.westus3-01.azurewebsites.net/classify", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ title, artist, lyrics })
                        });

                        const data = await res.json();

                        loader.style.display = "none";

                        // Handle errors or warnings
                        if (data.error) {
                            responseBox.innerHTML = `<b>Error:</b> ${data.error}`;
                            return;
                        }

                        if (data.warning) {
                            responseBox.innerHTML = `<b>Warning:</b> ${data.warning}`;
                            return;
                        }

                        if (data.moods && data.moods.length > 0) {
                            const primaryMood = data.moods[0].mood;
                            const themeColor = getMoodColor(primaryMood);
                            document.documentElement.style.setProperty('--accentgreen', themeColor);
                        }

                        // Build output
                        let output = "";

                        if (data.moods && data.moods.length >= 2) {
                            const phrase = getMoodCombinationPhrase(data.moods);
                            output += `<h2 style="text-align: center; color: var(--accentgreen); text-transform: capitalize; margin-bottom: 20px;">"${phrase}"</h2>`;
                        }

                        if (data.songTitle) {
                            output += `<h3>${data.songTitle}</h3>`;
                        }

                        // Radar chart canvas
                        output += `<canvas id="moodChart" style="width:100%;max-width:450px;height:350px;margin:0 auto;display:block;"></canvas><br>`;

                        output += "<b>Top Moods:</b><br>";
                        data.moods.forEach(m => {
                            output += `• ${m.mood} (${m.confidence}%)<br>`;
                        });

                        // Emotional arc
                        if (data.arc && data.arc.length) {
                            output += `<br><b>Emotional Arc:</b><br>`;
                            output += `<canvas id="arcChart" style="width:100%;max-width:450px;height:180px;margin:0 auto;display:block;"></canvas><br>`;
                        }

                        if (data.activities && data.activities.length) {
                            output += `<br><b>Suggested Activities:</b><br>`;
                            data.activities.forEach(a => {
                                output += `• ${a}<br>`;
                            });
                        }

                        // Similar songs
                        if (data.similar && data.similar.length) {
                            output += `<br><b>Similar Songs:</b><br>`;
                            data.similar.forEach(s => {
                                output += `• ${s.name} — ${s.artist}<br>`;
                            });
                        }

                        if (data.lyrics) {
                            output += `<br><b>Lyrics Preview:</b><br><pre>${data.lyrics}</pre>`;
                        }

                        responseBox.innerHTML = output;

                        const copyBtn = document.getElementById("copyBtn");
                        copyBtn.style.display = "block";

                        copyBtn.onclick = () => {
                            const textToCopy = `COIL Mood Analysis for "${data.songTitle}": ${data.moods.map(m => m.mood).join(", ")}`;
                            navigator.clipboard.writeText(textToCopy).then(() => {
                                copyBtn.innerText = "Copied!";
                                setTimeout(() => { copyBtn.innerText = "Copy Results"; }, 2000);
                            });
                        };

                        // Render emotional arc line chart
                        if (data.arc && data.arc.length) {
                            const arcCtx = document.getElementById('arcChart').getContext('2d');
                            const arcColors = data.arc.map(a => getMoodColor(a.mood));
                            new Chart(arcCtx, {
                                type: 'line',
                                data: {
                                    labels: data.arc.map(a => `Sec ${a.section}\n${a.mood}`),
                                    datasets: [{
                                        data: data.arc.map(a => getMoodValence(a.mood)),
                                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accentgreen').trim(),
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true,
                                        backgroundColor: 'rgba(5, 223, 114, 0.1)',
                                        pointBackgroundColor: arcColors,
                                        pointBorderColor: arcColors,
                                        pointRadius: 8,
                                        pointHoverRadius: 10,
                                    }]
                                },
                                options: {
                                    scales: {
                                        y: {
                                            min: 0, max: 10,
                                            grid: { color: 'rgba(175,175,175,0.1)' },
                                            ticks: {
                                                color: 'rgb(175,175,175)', stepSize: 2,
                                                callback: v => ['', 'negative', '', '', '', 'neutral', '', '', '', '', 'positive'][v] || ''
                                            },
                                        },
                                        x: {
                                            grid: { color: 'rgba(175,175,175,0.1)' },
                                            ticks: { color: 'rgb(175,175,175)', font: { size: 11 } },
                                        }
                                    },
                                    plugins: { legend: { display: false } },
                                }
                            });
                        }

                        // Render radar chart
                        const ctx = document.getElementById('moodChart').getContext('2d');
                        new Chart(ctx, {
                            type: 'radar',
                            data: {
                                labels: data.moods.map(m => m.mood),
                                datasets: [{
                                    label: 'Mood Profile',
                                    data: data.moods.map(m => m.confidence),
                                    backgroundColor: 'rgba(5, 223, 114, 0.2)',
                                    borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accentgreen').trim(),
                                    borderWidth: 2,
                                    pointBackgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--accentgreen').trim(),
                                    pointBorderColor: getComputedStyle(document.documentElement).getPropertyValue('--accentgreen').trim(),
                                }]
                            },
                            options: {
                                scales: {
                                    r: {
                                        beginAtZero: true,
                                        max: 100,
                                        grid: { color: 'rgba(175,175,175,0.2)' },
                                        angleLines: { color: 'rgba(175,175,175,0.2)' },
                                        pointLabels: { color: 'rgb(175,175,175)', font: { size: 12 } },
                                        ticks: { display: false },
                                    }
                                },
                                plugins: {
                                    legend: { display: false },
                                },
                            }
                        });

                    } catch (err) {
                        console.error(err);
                        document.getElementById("loading").style.display = "none";
                        responseBox.innerHTML = "Failed to connect to the server.";
                    }
                });  
            </script>
        </div>
    </div>
</body>
